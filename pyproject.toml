[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aer-plugin-template"
version = "1.0.0"
description = "A template code repo for aer plugins"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = ["satellite", "remote-sensing", "earth-observation", "aer", "plugin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
authors = [{ name = "Fran Dorr" }]
dependencies = ["aer-eo"]

[project.urls]
Homepage = "https://github.com/frandorr/aer-plugin-template"
Repository = "https://github.com/frandorr/aer-plugin-template"
Issues = "https://github.com/frandorr/aer-plugin-template/issues"
Documentation = "https://frandorr.github.io/aer-plugin-template"

[tool.uv]
managed = true
add-bounds = "major"

[tool.uv.workspace]
members = ["projects/*"]

[tool.uv.sources]
aer-eo = { path = "../aer/projects/aer-core", editable = true }

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
dev-mode-dirs = ["components", "bases", "development", "."]

[tool.ruff]
exclude = [
    ".git",
    ".github",
    "__pycache__",
    ".mypy_cache",
    ".ruff_cache",
    "dist",
    ".venv",
    "./development/*.py",
]
line-length = 120

[tool.basedpyright]
venvPath = "."
venv = ".venv"
extraPaths = ["components/", "bases/"]
